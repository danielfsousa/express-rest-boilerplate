name: CI

on:
  push:
    branches: [main, v2, fullstack]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vite+ and Node
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '26'
          cache: true

      - name: Restore Vite Task cache
        id: vite-task-cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-

      - name: Validate Varlock environment schema
        run: pnpm exec varlock load --agent

      - name: Build workspace packages and web app
        run: pnpm run build

      - name: Validate React JSX email templates (dry-run)
        run: pnpm run email:templates:dry-run

      - name: Format and lint check
        run: pnpm run check

      - name: Type-aware lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit, component, and integration tests with coverage
        run: pnpm run test:cov

      - name: Save Vite Task cache
        if: success()
        uses: actions/cache/save@v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}

  upload-email-templates:
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v2' || github.ref == 'refs/heads/fullstack') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vite+ and Node
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '26'
          cache: true

      - name: Compile i18n and email templates
        run: pnpm exec vp run --cache -t @starter/email#build && pnpm --filter @starter/i18n build

      - name: Upload email templates to Bird
        env:
          BIRD_API_KEY: ${{ secrets.BIRD_API_KEY }}
        run: |
          if [ -n "$BIRD_API_KEY" ]; then
            APP_ENV=prod pnpm run email:templates:upload
          else
            echo "::notice::BIRD_API_KEY secret is not configured; running template compilation dry-run instead."
            pnpm run email:templates:dry-run
          fi

  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Terraform format check
        run: terraform fmt -check -recursive infra/terraform

      - name: Terraform validate
        working-directory: infra/terraform
        run: |
          terraform init -backend=false
          terraform validate

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vite+ and Node
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '26'
          cache: true

      - name: Compile i18n and email templates
        run: pnpm exec vp run --cache -t @starter/email#build && pnpm --filter @starter/i18n build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start Postgres and Floci
        run: POSTGRES_HOST_PORT=5432 docker compose up -d postgres floci floci-init

      - name: Run database migrations
        env:
          DATABASE_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/bookstore
        run: pnpm --filter @starter/db db:migrate

      - name: Start emulators, upload email templates, start API and Web, and run Playwright E2E
        env:
          DATABASE_URL: postgres://app_user:app_password@127.0.0.1:5432/bookstore
          DATABASE_DIRECT_URL: postgres://app_user:app_password@127.0.0.1:5432/bookstore
          WORKER_INLINE: 'true'
          FEATURE_BILLING_ENABLED: 'false'
          E2E_WEB_URL: http://127.0.0.1:3000
          E2E_API_URL: http://127.0.0.1:3001
          E2E_BIRD_URL: http://127.0.0.1:4010
        run: |
          pnpm run dev:emulators &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4010/__messages >/dev/null; then break; fi
            sleep 1
          done
          pnpm run email:templates:upload
          curl -sf http://127.0.0.1:4010/__templates >/dev/null
          pnpm --filter @starter/api start &
          pnpm --filter @starter/web dev -- --host 127.0.0.1 --port 3000 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3001/health/live && curl -sf http://127.0.0.1:3000; then break; fi
            sleep 1
          done
          pnpm run test:e2e
